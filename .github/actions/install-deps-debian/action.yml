name: Install Deps Debian

description: Install build and test dependencies on Debian-based systems

runs:
  using: composite
  steps:
    - run: |
        apt-get --allow-releaseinfo-change update
        apt-get -y -f install \
          build-essential \
          ninja-build \
          cmake \
          lua5.1 \
          luarocks \
          lcov \
          ruby-dev \
          liblz4-dev \
          libbenchmark-dev \
          autoconf \
          automake \
          libtool

        apt-get purge --auto-remove cmake -y
        # Old Ubuntu and Debian repos do not contain cmake 3.26.0.
        # Thus, we use an alternative way of installing this
        # version.
        curl -O -L https://github.com/Kitware/CMake/releases/download/v3.26.0/cmake-3.26.0-linux-$(uname -i).tar.gz \
        && tar -xvf cmake-3.26.0-linux-$(uname -i).tar.gz -C /usr/local --strip-components=1 \
        && rm cmake-3.26.0-linux-$(uname -i).tar.gz

        # (Re)install luacheck only if it is not installed (or if another
        # version is installed).
        #
        # This reduces amount of failures when connectivity to luarocks.org is
        # unreliable. See the following issues for details:
        #
        # https://github.com/tarantool/tarantool/issues/12600
        # https://github.com/tarantool/tarantool/issues/12783
        luarocks show luacheck 0.26.1 || luarocks install luacheck 0.26.1
        gem install coveralls-lcov
      shell: bash
