name: trivy

on:
  push:
    branches:
      - 'master'
      - 'release/**'
      - 'ak/trivy-sca' #remove before PR
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    # CVE database updates independently of dependency bumps.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ (
    github.ref == 'refs/heads/master' ||
    startsWith(github.ref, 'refs/heads/release/') ||
    startsWith(github.ref, 'refs/tags/')) &&
    format('{0}-{1}', github.run_id, github.run_attempt) ||
    format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  trivy:
    if: github.repository == 'tarantool/tarantool' &&
        ( github.event_name != 'pull_request' ||
          ( github.event_name == 'pull_request' &&
            !contains(github.event.pull_request.labels.*.name, 'notest') ) )

    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # test-run/requirements.txt lives in a submodule.
          submodules: recursive

      - name: Generate conan.lock
        run: python3 tools/gen-conan-lock -i extra/dependencies.yaml -o conan.lock

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          # Fail the job when HIGH or CRITICAL vulnerabilities are found.
          exit-code: '1'
          format: json
          output: trivy.json

      - name: Show recommended versions
        if: always()
        run: |
          test -f trivy.json || { echo 'trivy.json not found'; exit 0; }
          python3 - <<'PY'
          import json
          from collections import defaultdict

          def ver_key(v):
              parts = []
              for p in v.replace('-', '.').split('.'):
                  try:
                      parts.append((0, int(p)))
                  except ValueError:
                      parts.append((1, p))
              return parts

          with open('trivy.json') as f:
              data = json.load(f)

          pkgs = defaultdict(lambda: {
              'installed': None, 'fixed': set(), 'cves': [],
          })
          for result in data.get('Results') or []:
              for vuln in result.get('Vulnerabilities') or []:
                  name = vuln.get('PkgName')
                  pkgs[name]['installed'] = vuln.get('InstalledVersion')
                  fixed = vuln.get('FixedVersion') or ''
                  if fixed.strip():
                      pkgs[name]['fixed'].add(fixed.strip())
                  pkgs[name]['cves'].append(
                      (vuln.get('VulnerabilityID'), vuln.get('Severity'),
                       fixed.strip() or 'no fix'))

          if not pkgs:
              print('No HIGH/CRITICAL findings')
          else:
              print('Recommended versions (cover all listed HIGH/CRITICAL):')
              print()
              for name in sorted(pkgs):
                  info = pkgs[name]
                  if info['fixed']:
                      rec = max(info['fixed'], key=ver_key)
                  else:
                      rec = 'no fix in advisory'
                  print('  %s %s -> %s' % (name, info['installed'], rec))
                  for cve, sev, fixed in info['cves']:
                      print('      %s %s (fixed in %s)' % (cve, sev, fixed))
                  print()
          PY

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            conan.lock
            trivy.json

      - name: Remove generated conan.lock
        if: always()
        run: rm -f conan.lock

      - name: Send VK Teams message on failure
        if: failure()
        uses: ./.github/actions/report-job-status
        with:
          bot-token: ${{ secrets.VKTEAMS_BOT_TOKEN }}
