name: macos

on:
  push:
    branches:
      - 'master'
      - 'release/**'
    tags:
      - '**'
  pull_request:

jobs:
  macos:
    # The workflow-level `on` clause skips most runs in a fork, but we have to
    # skip long-lived branches and tags on the job level.
    if: github.repository_owner == 'tarantool'

    runs-on: macos-latest

    timeout-minutes: 15

    steps:
      # Speeds up actions/checkout.
      #
      # https://github.com/actions/checkout/issues/945
      - name: Parallelize submodules fetching
        run: git config --global submodule.fetchJobs 8

      - uses: actions/checkout@v7
        with:
          # The version of the build is `git describe` of the tree.
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install gevent pyyaml
          echo ~/venv/bin >> "$GITHUB_PATH"

      - name: Build
        run: |
          cmake -S . -B ~/build      \
            -G Ninja                 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTEST_BUILD=ON
          cmake --build ~/build

      # http_client_test.lua hangs in test_http_client_content_length_invalid.
      #
      # http_client_http_version_test.lua is known to be unstable on macOS
      # (gh-12587).
      - name: Run tests
        run: |
          ./test/test-run.py                   \
            --builddir ~/build                 \
            --force                            \
            --retries 3                        \
            --exclude http_client_test         \
            --exclude http_client_http_version \
            app-luatest/ unit/

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos
          retention-days: 21
          path: /tmp/t/artifacts
