name: integration

on:
  push:
    branches:
      - 'master'
      - 'release/**'  # release branches
      - '**full-ci**'
    tags:
      - '*'
  pull_request:
    types: [ opened, reopened, synchronize, labeled ]
  workflow_dispatch:
  workflow_call:
    inputs:
      submodule:
        description: Name of submodule to bump.
        required: true
        type: string
      revision:
        description: Git revision from submodule repository
        required: true
        type: string
      tarantool_revision:
        description: Git revision for the Tarantool repository
        required: false
        default: 'master'
        type: string

concurrency:
  # Update of a developer branch cancels the previously scheduled workflow
  # run for this branch. However, the 'master' branch, release branch, and
  # tag workflow runs are never canceled.
  #
  # We use a trick here: define the concurrency group as 'workflow run ID' +
  # 'workflow run attempt' because it is a unique combination for any run.
  # So it effectively discards grouping.
  #
  # Important: we cannot use `github.sha` as a unique identifier because
  # pushing a tag may cancel a run that works on a branch push event.
  group: ${{ (
    github.ref == 'refs/heads/master' ||
    startsWith(github.ref, 'refs/heads/release/') ||
    startsWith(github.ref, 'refs/tags/')) &&
    format('{0}-{1}', github.run_id, github.run_attempt) ||
    format('{0}-{1}-integration', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  tarantool:
    # Run on push to the 'master' and release branches of tarantool/tarantool
    # or on pull request if the 'full-ci' or 'integration-ci' label is set.
    if: github.repository_owner == 'tarantool' &&
        ( github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'full-ci') ||
          contains(github.event.pull_request.labels.*.name, 'integration-ci') )

    uses: ./.github/workflows/reusable_build.yml
    with:
      ref: ${{ inputs.tarantool_revision || github.ref }}
      os: ubuntu
      dist: noble
      submodule: ${{ inputs.submodule }}
      revision: ${{ inputs.revision }}

  vshard:
    needs: tarantool
    uses: tarantool/vshard/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  # FIXME: Disabled due to tarantool/expirationd#176.
  # expirationd:
  #   needs: tarantool
  #   uses: tarantool/expirationd/.github/workflows/reusable_testing.yml@master
  #   with:
  #     artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  smtp:
    needs: tarantool
    uses: tarantool/smtp/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  memcached:
    needs: tarantool
    uses: tarantool/memcached/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  metrics:
    needs: tarantool
    uses: tarantool/metrics/.github/workflows/reusable-test.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  avro-schema:
    needs: tarantool
    uses: tarantool/avro-schema/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  queue:
    needs: tarantool
    uses: tarantool/queue/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  checks:
    needs: tarantool
    uses: tarantool/checks/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  mysql:
    needs: tarantool
    uses: tarantool/mysql/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  tarantool-c:
    needs: tarantool
    uses: tarantool/tarantool-c/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  tarantool-python:
    needs: tarantool
    uses: tarantool/tarantool-python/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  php-client:
    needs: tarantool
    uses: tarantool-php/client/.github/workflows/reusable_qa.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  php-queue:
    needs: tarantool
    uses: tarantool-php/queue/.github/workflows/reusable_qa.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  go-tarantool:
    needs: tarantool
    uses: tarantool/go-tarantool/.github/workflows/reusable_testing.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  crud:
    needs: tarantool
    uses: tarantool/crud/.github/workflows/reusable_test.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}
      # Reduce the testing matrix to save CI job time. The full test suite is
      # quite long (~50 minutes at the time of writing). The reduced suite
      # should be around 8 minutes with similar tarantool code coverage.
      #
      # First, essential information about crud's testing.
      #
      # There are testing groups of three kinds:
      #
      # A. Defined with helpers.backend_matrix(<...>).
      # B. Defined with its own matrix.
      # C. Defined without a matrix, a singleton test case.
      #
      # The A kind has 15 matrix cells:
      #
      # | ? |  N | backend | backend_cfg                                            | safe_mode |
      # | - | -- | ------- | ------------------------------------------------------ | --------- |
      # |   |  1 | vshard  | {identification_mode = "uuid_as_key"}                  |           |
      # |   |  2 | vshard  | {identification_mode = "uuid_as_key"}                  | false     |
      # |   |  3 | vshard  | {identification_mode = "uuid_as_key"}                  | true      |
      # |   |  4 | vshard  | {identification_mode = "name_as_key"}                  |           |
      # |   |  5 | vshard  | {identification_mode = "name_as_key"}                  | false     |
      # |   |  6 | vshard  | {identification_mode = "name_as_key"}                  | true      |
      # |   |  7 | vshard  | {identification_mode = "uuid_as_key", master = "auto"} |           |
      # |   |  8 | vshard  | {identification_mode = "uuid_as_key", master = "auto"} | false     |
      # |   |  9 | vshard  | {identification_mode = "uuid_as_key", master = "auto"} | true      |
      # | + | 10 | vshard  | {identification_mode = "name_as_key", master = "auto"} |           |
      # | + | 11 | vshard  | {identification_mode = "name_as_key", master = "auto"} | false     |
      # |   | 12 | vshard  | {identification_mode = "name_as_key", master = "auto"} | true      |
      # | + | 13 | config  | nil                                                    |           |
      # |   | 14 | config  | nil                                                    | false     |
      # | + | 15 | config  | nil                                                    | true      |
      #
      # The '?' column shows what is run here from the test cases of the kind A.
      #
      # Note 1: A group either defines safe_mode = false/true or it doesn't. We
      # keep cells both with and without safe_mode, so as not to miss test
      # cases.
      #
      # Note 2: Some groups add their own axes, for example, engine =
      # "memtx"/"vinyl". All these configuration variants are kept.
      #
      # So, we run:
      #
      # * 4/15 cells of A except three long rebalancing test cases.
      # * B in full.
      # * C in full.
      #
      # The choice of the A cells is such that all the test cases (except the
      # rebalancing ones) that run in the full suite are run in the reduced
      # one, but not in all the configurations. We can't run just one or two
      # cells, because some test cases are skipped with particular backends or
      # vshard's master modes and there is no cell that runs everything.
      #
      # The 'keep the running test cases list the same' is the method: the goal
      # is to keep tarantool's coverage on the same level. If you're going to
      # tune this workflow call, please briefly check gcov and luacov profiles.
      # Another point to consider is to try to make the exclusion list
      # future-proof: prefer referring to matrix parameters over particular
      # test case names, because the general parameters likely vary less over
      # time.
      #
      # Each -x line below skips particular cells of A. The luatest_args option
      # doesn't allow inline comments, so the list of skipped cells for each -x
      # option is here:
      #
      # 1. First -x skips cells 1, 2, 3.
      # 2. Second -x skips cells 4, 5, 6.
      # 3. Third -x skips cells 7, 8, 9.
      # 4. Fourth -x skips cell 12.
      # 5. Fifth -x skips cell 14.
      luatest_args: >-
        -x 'backend_cfg:{identification_mode = "uuid_as_key"}'
        -x 'backend_cfg:{identification_mode = "name_as_key"}'
        -x 'backend_cfg:{identification_mode = "uuid_as_key", master = "auto"}'
        -x 'backend_cfg:{identification_mode = "name_as_key", master = "auto"}.*safe_mode:true'
        -x 'backend:"config".*safe_mode:false'
        -x double_buckets_duplicates
        -x double_buckets_not_applied
        -x many_operations_errors

  # FIXME: Disabled due to tarantool/ddl#130.
  # ddl:
  #   needs: tarantool
  #   uses: tarantool/ddl/.github/workflows/reusable_test.yml@master
  #   with:
  #     artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}

  etcd-client:
    # Run on push to the 'master' and release branches or on non-fork pull
    # requests (secrets are unavailable in fork pull requests).
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: tarantool
    uses: tarantool/tarantool/.github/workflows/etcd_integration.yml@master
    with:
      artifact_name: tarantool-ubuntu-noble-${{ needs.tarantool.outputs.sha }}
    secrets: inherit
