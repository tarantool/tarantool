name: gdb

on:
  push:
    branches:
      - 'master'
      - 'release/**'
      - '**full-ci**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  # An update of a developer branch cancels the previously
  # scheduled workflow run for this branch. However, the default
  # branch, and long-term branch (tarantool/release/2.11,
  # tarantool/release/2.10, etc) workflow runs are never canceled.
  #
  # We use a trick here: define the concurrency group as 'workflow
  # run ID' + # 'workflow run attempt' because it is a unique
  # combination for any run. So it effectively discards grouping.
  #
  # XXX: we cannot use `github.sha` as a unique identifier because
  # pushing a tag may cancel a run that works on a branch push
  # event.
  group: ${{ startsWith(github.ref, 'refs/heads/tarantool/')
    && format('{0}-{1}', github.run_id, github.run_attempt)
    || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test-gdb:
    strategy:
      fail-fast: false
      matrix:
        ARCH: [ARM64, x86_64]
        build_type: [debug, release]
        include:
          - ARCH: x86_64
            runs-on: ubuntu-20.04-self-hosted
          - ARCH: ARM64
            runs-on: ubuntu-26.04-arm

    runs-on: ${{ matrix.runs-on }}

    timeout-minutes: 60

    container:
      image: docker.io/tarantool/testing:ubuntu-focal
      # Mount /dev to the container to be able to mount a disk image inside it
      # for successful run of the .github/actions/environment action.
      volumes:
        - /dev:/dev
      # Our testing expects that the init process (PID 1) will
      # reap orphan processes. At least the following test leans
      # on it: app-tap/gh-4983-tnt-e-assert-false-hangs.test.lua.
      # Add extra privileges to the container for successful run
      # of the .github/actions/environment action.
      options: '--init --privileged'

    steps:
      - name: Prepare checkout
        uses: tarantool/actions/prepare-checkout@master

      - name: Sources checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          repository: tarantool/tarantool
          ref: ${{ inputs.tarantool_revision || github.ref }}

      - name: Set environment
        uses: ./.github/actions/environment

      - name: Install deps
        uses: ./.github/actions/install-deps-debian

      - name: Install GDB test deps
        run: |
          apt -y update
          apt install -y gdb python3 python3-pip
          pip3 install pytest
        shell: bash

      - name: test
        run: make -f .test.mk test-gdb-${{ matrix.build_type }}
