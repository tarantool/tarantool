SPECIFICATION Spec

\* The fast configuration: a majority quorum on 3 data nodes. Every quorum
\* is 2 of 3, so a missing intersection would show immediately.
CONSTANTS
    NodeIDs = {n1, n2, n3}
    VoterIDs = {}
    AllTransactions = {a, b}
    MaxTerm = 3
    MaxPromotes = 999
    InitialLimboOwner = n1
    Quorum = 2
    NULL = 0
    EntryTypeTransaction = "txn"
    EntryTypePromote = "promote"
    EntryTypeConfirm = "confirm"
    RaftStateFollower = "follower"
    RaftStateCandidate = "candidate"
    RaftStateLeader = "leader"
    LimboStateReplica = "replica"
    LimboStateLeader = "leader"
    NodeRoleCandidate = "role-candidate"
    NodeRoleVoter = "role-voter"

\* Invariants to check
INVARIANTS
    TotalInvariant

\* Symmetry to reduce state space
SYMMETRY Perms

CHECK_DEADLOCK FALSE
